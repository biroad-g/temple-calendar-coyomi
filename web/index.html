<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="六曜・和暦・法事計算アプリ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="寺院こよみ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>寺院こよみカレンダー</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // 初回表示でも、フォントなど全ファイルを端末に保存してオフラインで使えるようにする
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function (reg) {
        if (reg && reg.active) {
          reg.active.postMessage('downloadOffline');
        }
        // 初回訪問ではトップページ("/")が保存されないため、ここで明示的に保存する。
        // サービスワーカーの起動処理(キャッシュの作り直し)が終わるのを待ってから追加する。
        var tries = 0;
        var timer = setInterval(function () {
          tries++;
          caches.open('flutter-app-cache').then(function (cache) {
            return cache.keys().then(function (keys) {
              var ready = keys.some(function (r) { return /main\.dart\.js/.test(r.url); });
              if (ready) {
                clearInterval(timer);
                return cache.add(location.origin + '/');
              }
            });
          }).catch(function () {});
          if (tries > 60) { clearInterval(timer); }
        }, 1000);
      }).catch(function () {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
